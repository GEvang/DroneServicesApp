plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def versions = [
        // Core Android & UI (SDK 33–friendly set)
        coreKtx             : '1.10.1',
        material            : '1.8.0',
        constraintLayout    : '2.1.4',
        appCompat           : '1.6.1',
        preference          : '1.2.0',
        securityCrypto      : '1.1.0-alpha06',

        // Lifecycle & Navigation (avoid 2.7+ which requires compileSdk 34)
        lifecycle           : '2.6.1',
        navigation          : '2.5.3',

        // Google Play Services
        playServicesMaps    : '18.1.0',
        playServicesLocation: '21.0.1',
        mapsUtils           : '3.4.0',

        // Reactive (RxJava 2 — matches your imports io.reactivex.*)
        rxjava2             : '2.2.21',
        rxandroid2          : '2.1.1',

        // Utilities
        processPhoenix      : '2.1.2',
        mavlink             : '1.1.11',
        osmdroid            : '6.1.20',

        // Testing
        junit               : '4.13.2',
        archCoreTesting     : '2.2.0',
        junitKtx            : '1.1.5',
        testMonitor         : '1.6.1',
]

android {
    compileSdk 33
    namespace 'com.example.droneservicesapp'

    defaultConfig {
        applicationId "com.example.droneservicesapp"
        minSdk 30
        targetSdk 33

        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Keep only these locales packaged (as you had it)
        resourceConfigurations += ['en', 'el']
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = "11"
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    // Core Android
    implementation "androidx.core:core-ktx:${versions.coreKtx}"
    implementation "androidx.appcompat:appcompat:${versions.appCompat}"
    implementation "com.google.android.material:material:${versions.material}"
    implementation "androidx.constraintlayout:constraintlayout:${versions.constraintLayout}"

    // Lifecycle & ViewModel
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:${versions.lifecycle}"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:${versions.lifecycle}"

    // Navigation
    implementation "androidx.navigation:navigation-fragment-ktx:${versions.navigation}"
    implementation "androidx.navigation:navigation-ui-ktx:${versions.navigation}"

    // UI Components
    implementation "androidx.preference:preference-ktx:${versions.preference}"
    implementation "androidx.security:security-crypto:${versions.securityCrypto}"

    // Google Play Services
    implementation "com.google.android.gms:play-services-maps:${versions.playServicesMaps}"
    implementation "com.google.android.gms:play-services-location:${versions.playServicesLocation}"
    implementation "com.google.maps.android:android-maps-utils:${versions.mapsUtils}"

    // Reactive (RxJava 2)
    implementation "io.reactivex.rxjava2:rxjava:${versions.rxjava2}"
    implementation "io.reactivex.rxjava2:rxandroid:${versions.rxandroid2}"

    // Utilities
    implementation "com.jakewharton:process-phoenix:${versions.processPhoenix}"
    implementation "io.dronefleet.mavlink:mavlink:${versions.mavlink}"
    implementation "org.osmdroid:osmdroid-android:${versions.osmdroid}"

    // Unit testing
    testImplementation "junit:junit:${versions.junit}"
    testImplementation "androidx.arch.core:core-testing:${versions.archCoreTesting}"

    // Instrumentation testing (correct scope)
    androidTestImplementation "androidx.test:monitor:${versions.testMonitor}"
    androidTestImplementation "androidx.test.ext:junit-ktx:${versions.junitKtx}"
}
